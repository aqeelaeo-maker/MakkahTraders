<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Green Arc -->
  <path d="M 55 120 Q 250 40 445 120 Q 250 62 55 120 Z" fill="#0f8b3d" />
  
  <!-- Yellow Star at Apex (x=250, y=78) -->
  <g transform="translate(250, 78)">
    <!-- Vertical long ray -->
    <polygon points="0,-36 5,0 0,36 -5,0" fill="#ffd700" />
    <!-- Horizontal ray -->
    <polygon points="-28,0 0,4 28,0 0,-4" fill="#ffd700" />
    <!-- Diagonal smaller rays -->
    <polygon points="-14,-14 0,2 14,14 2,0" fill="#ffd700" />
    <polygon points="14,-14 -2,0 -14,14 0,-2" fill="#ffd700" />
    <!-- Central highlight -->
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- FBR Text -->
  <text x="250" y="175" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="86" fill="#004fa3" text-anchor="middle" letter-spacing="-2">FBR</text>

  <!-- Blue Rounded Box -->
  <rect x="20" y="195" width="460" height="245" rx="28" ry="28" fill="#004fa3" />

  <!-- DIGITAL Text -->
  <text x="250" y="365" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="132" fill="#ffffff" text-anchor="middle" letter-spacing="2">DIGITAL</text>

  <!-- INVOICING SYSTEM Text -->
  <text x="250" y="420" font-family="'Arial Black', 'Arial', sans-serif" font-weight="800" font-size="33" fill="#ffffff" text-anchor="middle" letter-spacing="3.5">INVOICING SYSTEM</text>
</svg>
